app = 'erp-hwzl0w'
primary_region = 'gru'

[build]
  dockerfile = 'Dockerfile'

[env]
  SERVER_PORT = '8080'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']
  concurrency = { hard_limit = 250, soft_limit = 200, type = 'requests' }

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 512
