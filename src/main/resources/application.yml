spring:
  application:
    name: ${SPRING_APPLICATION_NAME:erp}
  main:
    lazy-initialization: ${SPRING_LAZY_INITIALIZATION:true}
    banner-mode: ${BANNER_MODE:${SPRING_BANNER_MODE:off}}

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/erp_db?useSSL=false&createDatabaseIfNotExist=true&serverTimezone=UTC&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:erp_user}
    password: ${DB_PASSWORD:erp_password}
    driver-class-name: ${DB_DRIVER_CLASS_NAME:com.mysql.cj.jdbc.Driver}

  jpa:
    database-platform: ${JPA_DATABASE_PLATFORM:org.hibernate.dialect.MySQLDialect}
    hibernate:
      ddl-auto: ${JPA_HIBERNATE_DDL_AUTO:none}
    show-sql: ${JPA_SHOW_SQL:false}
    open-in-view: ${JPA_OPEN_IN_VIEW:false}
    properties:
      hibernate:
        format_sql: ${JPA_HIBERNATE_FORMAT_SQL:true}
        use_sql_comments: ${JPA_HIBERNATE_USE_SQL_COMMENTS:true}

  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    locations: ${FLYWAY_LOCATIONS:classpath:db/migration}
    baseline-on-migrate: ${FLYWAY_BASELINE_ON_MIGRATE:true}
    baseline-version: ${FLYWAY_BASELINE_VERSION:0}
    validate-on-migrate: ${FLYWAY_VALIDATE_ON_MIGRATE:true}

auth:
  reset-password:
    base-url: ${RESET_PASSWORD_URL:http://localhost:5173/redefinir-senha}
    expiration-minutes: ${RESET_PASSWORD_EXPIRATION_MINUTES:60}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

jwt:
  secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
  expiration: ${JWT_EXPIRATION:86400000} # 24 horas (em milissegundos)

cloudflare:
  r2:
    account-id: ${CLOUDFLARE_R2_ACCOUNT_ID:}
    access-key-id: ${CLOUDFLARE_R2_ACCESS_KEY_ID:}
    secret-access-key: ${CLOUDFLARE_R2_SECRET_ACCESS_KEY:}
    bucket-name: ${CLOUDFLARE_R2_BUCKET_NAME:}
    public-url: ${CLOUDFLARE_R2_PUBLIC_URL:}
    endpoint: ${CLOUDFLARE_R2_ENDPOINT:}
    trust-all-certificates: ${CLOUDFLARE_R2_TRUST_ALL:false}

aws:
  ses:
    access-key-id: ${AWS_SES_ACCESS_KEY_ID:${AWS_ACCESS_KEY_ID:}}
    secret-access-key: ${AWS_SES_SECRET_ACCESS_KEY:${AWS_SECRET_ACCESS_KEY:}}
    region: ${AWS_SES_REGION:${AWS_REGION:us-east-1}}
    from-email: ${AWS_SES_FROM_EMAIL:no-reply@company.com}
    from-name: ${AWS_SES_FROM_NAME:ERP Aura}
    configuration-set: ${AWS_SES_CONFIGURATION_SET:}
    endpoint: ${AWS_SES_ENDPOINT:}
    enabled: ${AWS_SES_ENABLED:true}

server:
  port: ${SERVER_PORT:8080}

springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLED:true}
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:true}

logging:
  level:
    root: ${LOG_LEVEL_ROOT:INFO}
    company.aura.erp: ${LOG_LEVEL_APP:DEBUG}
    org.springframework.web: ${LOG_LEVEL_SPRING_WEB:INFO}
    org.springframework.security: ${LOG_LEVEL_SPRING_SECURITY:INFO}
    org.springframework.data: ${LOG_LEVEL_SPRING_DATA:WARN}
    org.hibernate: ${LOG_LEVEL_HIBERNATE:WARN}
    org.hibernate.SQL: ${LOG_LEVEL_HIBERNATE_SQL:WARN}
    org.hibernate.orm.jdbc.bind: ${LOG_LEVEL_HIBERNATE_BIND:WARN}
    org.flywaydb: ${LOG_LEVEL_FLYWAY:INFO}
    com.zaxxer.hikari: ${LOG_LEVEL_HIKARI:WARN}
    feign: ${LOG_LEVEL_FEIGN:WARN}
    org.springframework.cloud.openfeign: ${LOG_LEVEL_OPENFEIGN:WARN}
    io.micrometer: ${LOG_LEVEL_MICROMETER:WARN}
    brave: ${LOG_LEVEL_BRAVE:WARN}
